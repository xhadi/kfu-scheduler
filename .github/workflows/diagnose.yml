name: Diagnose KFU network path

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Diagnose KFU network path
        run: |
          curl -sv "https://ssb-ar.kfu.edu.sa/PROD_ar/ws?p_trm_code=144810&p_col_code=01&p_sex_code=11" \
            -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36" \
            -o /dev/null 2>&1 | tail -60