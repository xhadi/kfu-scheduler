name: KFU Course Scraper

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      term_code:
        description: "Term code override (e.g., 144810)"
        required: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r backend/requirements.txt
      - run: python backend/run_scraper.py
        env:
          TERM_CODE: ${{ github.event.inputs.term_code || vars.TERM_CODE }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          ADMIN_CHAT_ID: ${{ secrets.ADMIN_CHAT_ID }}
          MIN_SECTIONS_THRESHOLD: ${{ vars.MIN_SECTIONS_THRESHOLD || '1000' }}
